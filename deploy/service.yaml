apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sofi-copilot
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Allow up to 10 concurrent requests per instance (CPU-bound rules engine)
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 60
      serviceAccountName: sofi-copilot-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/PROJECT_ID/sofi-copilot:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: sofi-copilot-secrets
                  key: GCP_PROJECT_ID
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sofi-copilot-secrets
                  key: GEMINI_API_KEY
            - name: ALLOWED_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: sofi-copilot-secrets
                  key: ALLOWED_ORIGIN
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
